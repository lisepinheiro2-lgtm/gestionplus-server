server:
  forward-headers-strategy: none
  max-http-request-header-size: 8KB
  tomcat:
    max-http-form-post-size: ${gestionplus.http.max-body-bytes:16384}B
    max-parameter-count: 32
  servlet:
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax

spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USER:default}
      password: ${REDIS_PASSWORD}
      connect-timeout: 2s
      timeout: 2s
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  session:
    timeout: 30m
    data:
      redis:
        repository-type: indexed
        namespace: gestionplus:${gestionplus.cluster.namespace}:sessions
  threads:
    virtual:
      enabled: true
  application:
    name: gestionplus-server

  datasource:
    url: jdbc:postgresql://localhost:5432/gestionplus_dev
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  mail:
    properties:
      mail.smtp.connectiontimeout: 60000
      mail.smtp.writetimeout: 60000
      mail.smtp.timeout: 60000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

gestionplus:
  cluster:
    namespace: ${GESTIONPLUS_CLUSTER_NAMESPACE}
    rate-limit-key: ${GESTIONPLUS_RATE_LIMIT_KEY}
