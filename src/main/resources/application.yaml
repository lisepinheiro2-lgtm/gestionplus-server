server:
  forward-headers-strategy: none
  max-http-request-header-size: 8KB
  tomcat:
    max-http-form-post-size: ${gestionplus.http.max-body-bytes:16384}B
    max-parameter-count: 32
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: gestionplus-server

  datasource:
    url: jdbc:postgresql://localhost:5432/gestionplus_dev
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  mail:
    properties:
      mail.smtp.connectiontimeout: 60000
      mail.smtp.writetimeout: 60000
      mail.smtp.timeout: 60000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    user: ${DB_MIGRATION_USER:${spring.datasource.username}}
    password: ${DB_MIGRATION_PASSWORD:${spring.datasource.password}}