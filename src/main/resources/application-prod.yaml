server:
  ssl:
    enabled: true
  servlet:
    session:
      cookie:
        secure: true

gestionplus:
  http:
    require-https: true

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}

  flyway:
    user: ${DB_MIGRATION_USER}
    password: ${DB_MIGRATION_PASSWORD}